services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: menu
      POSTGRES_USER: menu
      # local-only database, bound to loopback below
      POSTGRES_PASSWORD: menu
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U menu -d menu"]
      interval: 2s
      retries: 15

volumes:
  pgdata:
